# ------------------------------------------------------------
# HTTP: used for Let's Encrypt ACME challenge + redirect to HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name kuchimittai.com www.kuchimittai.com;

    # Certbot HTTP-01 challenge files
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# HTTPS: reverse proxy to the Spring Boot app container
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kuchimittai.com www.kuchimittai.com;

    ssl_certificate     /etc/letsencrypt/live/kuchimittai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuchimittai.com/privkey.pem;

    # Allow larger payloads (image uploads, etc.)
    client_max_body_size 25M;

    # Spring Boot app has server.servlet.context-path=/api, so we forward the
    # full /api/... path through unchanged (note: no trailing slash on
    # proxy_pass here means nginx does NOT strip the /api prefix).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Useful for long-running requests (report generation, uploads, etc.)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location = /actuator/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
    }
}

