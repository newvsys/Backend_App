version: '3.9'

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - mynetwork

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # The certbot image's ENTRYPOINT is already ["certbot"], so without
    # overriding it here, `command` gets appended after "certbot" (e.g.
    # "certbot sh -c ...") which certbot then tries to parse as its own
    # arguments. Override the entrypoint with /bin/sh so the loop below
    # actually runs as a shell script instead.
    entrypoint: ["/bin/sh", "-c"]
    command: >
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h;
      done
    networks:
      - mynetwork

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: onlineshopping
      POSTGRES_DB: onlineshop
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # <== FIXED
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork


  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/onlineshop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: onlineshopping

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB

      FIREBASE_ENABLED: "true"
      FIREBASE_SERVICE_ACCOUNT_FILE: "file:/app/secrets/firebase-service-account.json"

    expose:
      - "8080"
    volumes:
      - ./logs:/app/logs
      - ./secrets/kuchimittai-dd858-firebase-adminsdk-fbsvc-5caaee8749.json:/app/secrets/firebase-service-account.json:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - mynetwork

volumes:
  postgres_data:


networks:
  mynetwork:
    external: true

