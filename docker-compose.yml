services:

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the REAL host system certs (already issued via a previous native
      # certbot install at /etc/letsencrypt), not a local project-relative dir.
      # ro because nginx only needs to read them.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    networks:
      - mynetwork

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    volumes:
      # Same real host cert directory as nginx (read-write here since certbot
      # needs to write renewed certs back to it).
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./certbot-init.sh:/certbot-init.sh:ro
    # Override entrypoint to run our initialization script which generates
    # initial certificates if they don't exist, then runs the renewal loop
    entrypoint: ["/bin/sh"]
    command: ["/certbot-init.sh"]
    networks:
      - mynetwork

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: onlineshopping
      POSTGRES_DB: onlineshop
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # <== FIXED
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mynetwork


  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Kolkata
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/onlineshop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: onlineshopping

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 20MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 20MB

      FIREBASE_ENABLED: "true"
      FIREBASE_SERVICE_ACCOUNT_FILE: "file:/app/secrets/firebase-service-account.json"

    expose:
      - "8080"
    volumes:
      - ./logs:/app/logs
      - ./secrets/kuchimittai-dd858-firebase-adminsdk-fbsvc-5caaee8749.json:/app/secrets/firebase-service-account.json:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - mynetwork

volumes:
  # Bind-mounted named volume that matches the EXISTING
  # backend_app_postgres_data volume so it is reused (no recreation / data loss).
  # NOTE: the host directory below must exist. Create it once with:
  #   mkdir -p "$PWD/data/postgres"
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres


networks:
  mynetwork:
    external: true

